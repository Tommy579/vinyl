<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Vinyle</title>
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Barre de titre custom (fenêtre sans cadre) -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-brand">
      <img src="assets/vinyl.png" class="brand-icon" alt="Vinyle" />
      <span>Vinyle</span>
    </div>
    <div class="titlebar-controls">
      <button id="btn-min" class="tb-btn" title="Réduire">–</button>
      <button id="btn-close" class="tb-btn tb-close" title="Fermer">×</button>
    </div>
  </header>

  <main class="stage">

    <!-- Zone d'affichage lectrice -->
    <section class="turntable-wrap">

      <!-- PLATINE VINYLE -->
      <div class="player-view view-vinyl" id="view-vinyl">
        <div class="plinth">
          <div class="plinth-grain"></div>

          <div class="platter">
            <div class="vinyl" id="vinyl">
              <div class="vinyl-grooves"></div>
              <div class="label" id="vinyl-label">
                <img id="artwork-img" alt="" />
                <div class="label-fallback" id="label-fallback">♪</div>
              </div>
              <div class="spindle-hole"></div>
            </div>
          </div>

          <!-- Bras de lecture interactif -->
          <div class="tonearm-base">
            <div class="tonearm" id="tonearm">
              <div class="tonearm-tube"></div>
              <div class="tonearm-head">
                <div class="stylus-tip"></div>
              </div>
            </div>
          </div>

          <div class="plinth-label">MD&nbsp;·&nbsp;WIN</div>
        </div>

        <p class="hint" id="drop-hint"><span class="hint-dot"></span>Fais glisser le bras vers le disque pour lancer la lecture</p>
      </div>

      <!-- LECTEUR CASSETTE FERGUSON -->
      <div class="player-view view-cassette" id="view-cassette" hidden>
        <div class="cassette-deck">
          <div class="cassette-speaker-grille"></div>
          
          <div class="cassette-window">
            <div class="cassette-body">
              <div class="cassette-screw top-left"></div>
              <div class="cassette-screw top-right"></div>
              <div class="cassette-screw bottom-left"></div>
              <div class="cassette-screw bottom-right"></div>

              <!-- Étiquette Papier Style Mixtape -->
              <div class="cassette-paper-sticker">
                <div class="sticker-top-bar">
                  <div class="sticker-side-tag">A</div>
                  <div class="sticker-handwriting-title" id="cassette-handwriting-title">AWESOME MIX VOL. 1</div>
                  <div class="sticker-c90-badge">C-90</div>
                </div>

                <div class="sticker-middle-cutout">
                  <div class="cassette-spools">
                    <div class="cassette-spool left" id="spool-left">
                      <div class="spool-teeth"></div>
                      <div class="tape-roll" id="tape-left"></div>
                    </div>
                    <div class="cassette-tape-viewfinder">
                      <div class="viewfinder-lines"></div>
                    </div>
                    <div class="cassette-spool right" id="spool-right">
                      <div class="spool-teeth"></div>
                      <div class="tape-roll" id="tape-right"></div>
                    </div>
                  </div>
                </div>

                <div class="sticker-bottom-bar">
                  <div class="sticker-brand-name">Elite®</div>
                  <div class="sticker-handwriting-artist" id="cassette-handwriting-artist">Love ♡ Mix</div>
                  <div class="sticker-tech-tag">NORMAL POSITION</div>
                </div>
              </div>

              <div class="cassette-bottom-holes">
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
              </div>
            </div>
          </div>

          <div class="cassette-control-panel">
            <div class="cassette-brand-badge">FERGUSON</div>
            <div class="cassette-level-meter">
              <div class="meter-bar" id="meter-bar"></div>
            </div>
          </div>

          <div class="cassette-keys">
            <button class="cassette-key key-rec" title="Record"><span class="key-top">REC</span></button>
            <button class="cassette-key" id="ckey-rew" title="Rewind"><span>REW</span></button>
            <button class="cassette-key" id="ckey-ff" title="Forward"><span>FF</span></button>
            <button class="cassette-key key-play" id="ckey-play" title="Play / Pause"><span>PLAY</span></button>
            <button class="cassette-key" id="ckey-stop" title="Stop"><span>STOP</span></button>
            <div class="cassette-knob-wrap">
              <div class="knob-label">VOL</div>
              <div class="cassette-knob" id="cassette-knob">
                <div class="knob-indicator"></div>
              </div>
            </div>
          </div>

          <div class="cassette-handle"></div>
        </div>
      </div>

      <!-- IPOD NANO -->
      <div class="player-view view-ipod" id="view-ipod" hidden>
        <div class="ipod-device">
          <div class="ipod-screen">
            <div class="ipod-statusbar">
              <span class="ipod-time" id="ipod-clock">10:45</span>
              <div class="ipod-status-icons">
                <span id="ipod-play-icon">▶</span>
                <span class="ipod-battery">🔋</span>
              </div>
            </div>
            <div class="ipod-nowplaying">
              <div class="ipod-artwork-box">
                <img id="ipod-artwork-img" alt="" />
                <div class="ipod-artwork-fallback" id="ipod-artwork-fallback">♪</div>
              </div>
              <div class="ipod-meta">
                <div class="ipod-song-title" id="ipod-song-title">Don't stop</div>
                <div class="ipod-artist-name" id="ipod-artist-name">Jeune Morty</div>
                <div class="ipod-album-name" id="ipod-album-name">Single</div>
              </div>
              <div class="ipod-progress-wrap">
                <span id="ipod-time-cur">0:40</span>
                <div class="ipod-progress-bar">
                  <div class="ipod-progress-fill" id="ipod-progress-fill"></div>
                </div>
                <span id="ipod-time-rem">-2:02</span>
              </div>
            </div>
          </div>

          <!-- Click Wheel iPod -->
          <div class="click-wheel">
            <button class="wheel-btn btn-menu" id="wheel-menu">MENU</button>
            <button class="wheel-btn btn-prev" id="wheel-prev">⏮</button>
            <button class="wheel-btn btn-next" id="wheel-next">⏭</button>
            <button class="wheel-btn btn-playpause" id="wheel-playpause">▶❚❚</button>
            <button class="wheel-center" id="wheel-center"></button>
          </div>
        </div>
      </div>

    </section>

    <!-- Panneau latéral -->
    <section class="panel">

      <div class="connection-pill" id="connection-pill">
        <span class="dot" id="connection-dot"></span>
        <span id="connection-text">Recherche d'Apple Music…</span>
      </div>

      <div class="player-card">
        <div class="now-playing-info">
          <h1 id="track-title">Aucun morceau</h1>
          <p id="track-artist">Lance la lecture dans Apple Music</p>
          <p id="track-album"></p>
        </div>

        <div class="player-card-divider"></div>

        <div class="transport">
          <button id="btn-prev" class="ctrl-btn" title="Précédent">⏮</button>
          <button id="btn-playpause" class="ctrl-btn ctrl-btn-lg" title="Lecture / Pause">▶</button>
          <button id="btn-next" class="ctrl-btn" title="Suivant">⏭</button>
        </div>

        <div class="progress">
          <span id="time-current">0:00</span>
          <input type="range" id="seek" min="0" max="100" value="0" />
          <span id="time-total">0:00</span>
        </div>

        <div class="volume">
          <span class="volume-icon">🔈</span>
          <input type="range" id="volume" min="0" max="100" value="80" />
        </div>
      </div>

      <div class="theme-drawer">
        <button class="drawer-toggle" id="drawer-toggle">
          <span class="drawer-title">🎨 Personnaliser l'apparence</span>
          <span id="drawer-arrow" class="drawer-arrow">▾</span>
        </button>

        <div class="drawer-body" id="drawer-body">
          <div class="fields-grid">
            <label class="field">
              <span>Mode d'affichage</span>
              <select id="display-mode-select">
                <option value="vinyl" selected>Platine Vinyle 🛈</option>
                <option value="cassette">Lecteur Cassette Ferguson 📼</option>
                <option value="ipod">iPod Nano 📱</option>
              </select>
            </label>

            <label class="field">
              <span>Thème de l'interface</span>
              <select id="app-theme-select">
                <option value="auto">Auto (Système Windows)</option>
                <option value="dark" selected>Sombre</option>
                <option value="light">Clair</option>
              </select>
            </label>

            <label class="field">
              <span>Finition de la table</span>
              <div class="field-control-group">
                <select id="table-wood-select">
                  <option value="noyer" selected>Bois — Noyer massif</option>
                  <option value="chene">Bois — Chêne clair</option>
                  <option value="acajou">Bois — Acajou rouge</option>
                  <option value="ebene">Bois — Ébène foncé</option>
                  <option value="erable">Bois — Érable crème</option>
                  <option value="custom">Couleur personnalisée</option>
                </select>
                <input type="color" id="table-custom-color" class="color-picker-inline" value="#4a2c1a" title="Choisir une couleur" hidden />
              </div>
            </label>

            <label class="field">
              <span>Couleur du disque vinyle</span>
              <div class="field-control-group">
                <select id="vinyl-color-select">
                  <option value="black" selected>Noir classique</option>
                  <option value="white">Blanc pur</option>
                  <option value="auto">Auto (Couleur de la pochette)</option>
                  <option value="custom">Couleur personnalisée</option>
                </select>
                <input type="color" id="vinyl-custom-color" class="color-picker-inline" value="#0b0b0d" title="Choisir une couleur" hidden />
              </div>
            </label>

            <label class="field">
              <span>Style du macaron central</span>
              <select id="texture-select">
                <option value="artwork" selected>Pochette d'album au centre (macaron)</option>
                <option value="uni">Macaron couleur unie</option>
                <option value="full-picture">Picture disc (pochette entière)</option>
              </select>
            </label>
          </div>

          <label class="field accent-field">
            <span>Couleur d'accentuation</span>
            <div class="accent-control-row">
              <input type="color" id="accent-color" class="color-picker-accent" value="#c97a3d" />
              <div class="accent-presets" id="accent-presets">
                <button type="button" class="accent-dot" data-color="#c97a3d" style="background:#c97a3d" title="Cuivre"></button>
                <button type="button" class="accent-dot" data-color="#d4af37" style="background:#d4af37" title="Or"></button>
                <button type="button" class="accent-dot" data-color="#e63946" style="background:#e63946" title="Rouge"></button>
                <button type="button" class="accent-dot" data-color="#2a9d8f" style="background:#2a9d8f" title="Émeraude"></button>
                <button type="button" class="accent-dot" data-color="#457b9d" style="background:#457b9d" title="Bleu Saphir"></button>
                <button type="button" class="accent-dot" data-color="#9d4edd" style="background:#9d4edd" title="Violet Améthyste"></button>
              </div>
            </div>
          </label>
        </div>
      </div>

    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
